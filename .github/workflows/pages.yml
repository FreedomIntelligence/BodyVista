name: Deploy BodyVista to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: |
          npm test
          python3 tools/test_pages_player.py
      - name: Build website and copy models
        run: npm run build
      - name: Add the verified motion library and browser player
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.1.0 --repo FreedomIntelligence/BodyVista --dir "$RUNNER_TEMP/bodyvista-release" \
            --pattern 'release-assets.json' \
            --pattern 'bodyvista-atlas-muscles-v1.1.0.bin' --pattern 'bodyvista-bone-volumes-v1.1.0.bin'
          gh release download v1.3.0 --repo FreedomIntelligence/BodyVista --dir "$RUNNER_TEMP/bodyvista-release" \
            --pattern 'bodyvista-motion-cache-v1.3.0.zip'
          python3 tools/build-pages-replay.py --bundle-dir "$RUNNER_TEMP/bodyvista-release" \
            --showcase-dir "$RUNNER_TEMP/bodyvista-release"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
