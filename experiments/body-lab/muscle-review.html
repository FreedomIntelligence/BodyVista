<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-review-text>BodyVista · 肌肉运动对照</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #202020; background: white; font: 16px/1.6 system-ui,sans-serif; }
  main { max-width: 1120px; margin: auto; padding: 16px clamp(12px,3vw,36px); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid #555; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  h2 { font-size: 19px; margin: 12px 0 0; }
  p { margin: 8px 0; }
  a { color: inherit; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  button, select { font: inherit; background: white; color: #191919; border: 1px solid #aaa; border-radius: 4px; padding: 5px 12px; }
  button[aria-pressed=true] { border-color: black; box-shadow: inset 0 -2px black; font-weight: 600; }
  video { width: 100%; height: auto; max-height: 64vh; display: block; background: #f8f8f5; margin-top: 10px; }
  small { color: #444; }
</style>
<main>
  <header><h1 data-review-text>肌肉运动对照</h1><a href="../../?workspace=muscle-motion" data-review-text>返回全身实验台</a></header>
  <p data-review-text>选择肌肉和视角，可以播放、暂停或拖动录像进度。每段录像标明采用的模型和仍能看到的问题。</p>
  <nav aria-label="选择肌肉"></nav>
  <h2 id="name"></h2><p id="desc" role="status"></p>
  <label><span data-review-text>录像</span> <select id="recording"></select></label>
  <video controls playsinline muted loop preload="metadata" aria-label="所选肌肉的实际运动录像"></video>
  <p id="caption"></p>
  <small data-review-text>近看轮廓时，可以比较附着点是否留在骨上，以及肌腹是否在某个位置突然收窄或鼓起。</small>
</main>
<script type="module">
import { startReview } from "./motion-locale-review.js";
startReview();
</script>
</html>
